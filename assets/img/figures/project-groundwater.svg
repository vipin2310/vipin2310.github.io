<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="gw-t gw-d" class="schematic">
  <title id="gw-t">Forecast anywhere: groundwater levels in time and space</title>
  <desc id="gw-d">Monitored wells on a contour map each carry a measured groundwater level series with a forecast. An unmonitored location between them, marked with a question mark, is predicted from nearby wells.</desc>
  <defs>
    <marker id="gw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="338" rx="12" fill="var(--bg)" stroke="var(--line)"/>
  <!-- isolines of the water table -->
  <g fill="none" stroke="var(--accent)" stroke-opacity=".18" stroke-width="1.3">
    <path d="M-10,300 C80,250 140,310 230,270 S400,200 470,240 S560,300 620,260"/>
    <path d="M-10,250 C90,200 150,255 240,220 S390,150 470,190 S570,240 620,205"/>
    <path d="M-10,200 C90,150 160,200 250,170 S380,100 470,140 S570,180 620,150"/>
    <path d="M-10,150 C100,105 170,150 260,120 S380,55 470,90 S570,125 620,95"/>
    <path d="M-10,100 C100,60 180,100 270,72 S390,15 480,45 S570,75 620,45"/>
  </g>
  <!-- spatial prediction: nearby wells inform the unmonitored location -->
  <g stroke="var(--accent-2)" stroke-width="1.8" stroke-dasharray="5 5" fill="none" marker-end="url(#gw-arrow)">
    <path d="M128,205 L262,214"/>
    <path d="M232,108 L280,190"/>
    <path d="M410,236 L318,222"/>
  </g>
  <!-- monitored wells, each with a level series: history (solid) + forecast (dashed) -->
  <g font-family="inherit" font-size="13" fill="var(--text)">
    <g transform="translate(120,205)">
      <rect x="-48" y="-78" width="96" height="52" rx="7" fill="var(--surface)" stroke="var(--line)"/>
      <path d="M-40,-44 L-30,-50 L-20,-46 L-10,-58 L0,-52 L8,-55" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <path d="M8,-55 L18,-50 L28,-56 L40,-53" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 3"/>
      <line x1="0" y1="-26" x2="0" y2="-8" stroke="var(--line)" stroke-width="1.5"/>
      <circle r="8" fill="var(--accent)"/>
    </g>
    <g transform="translate(225,100)">
      <rect x="-48" y="-78" width="96" height="52" rx="7" fill="var(--surface)" stroke="var(--line)"/>
      <path d="M-40,-48 L-30,-44 L-20,-52 L-10,-47 L0,-56 L8,-50" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <path d="M8,-50 L18,-55 L28,-49 L40,-52" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 3"/>
      <line x1="0" y1="-26" x2="0" y2="-8" stroke="var(--line)" stroke-width="1.5"/>
      <circle r="8" fill="var(--accent)"/>
    </g>
    <g transform="translate(420,238)">
      <rect x="-48" y="-78" width="96" height="52" rx="7" fill="var(--surface)" stroke="var(--line)"/>
      <path d="M-40,-50 L-30,-56 L-20,-49 L-10,-53 L0,-45 L8,-48" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <path d="M8,-48 L18,-43 L28,-50 L40,-46" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 3"/>
      <line x1="0" y1="-26" x2="0" y2="-8" stroke="var(--line)" stroke-width="1.5"/>
      <circle r="8" fill="var(--accent)"/>
    </g>
    <g transform="translate(505,105)">
      <rect x="-48" y="-78" width="96" height="52" rx="7" fill="var(--surface)" stroke="var(--line)"/>
      <path d="M-40,-46 L-30,-52 L-20,-50 L-10,-57 L0,-49 L8,-53" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <path d="M8,-53 L18,-47 L28,-52 L40,-49" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 3"/>
      <line x1="0" y1="-26" x2="0" y2="-8" stroke="var(--line)" stroke-width="1.5"/>
      <circle r="8" fill="var(--accent)"/>
    </g>
    <!-- unmonitored location -->
    <circle cx="290" cy="216" r="17" fill="var(--surface)" stroke="var(--accent-2)" stroke-width="2.5"/>
    <text x="290" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="var(--accent-2)">?</text>
    <!-- legend -->
    <g transform="translate(22,300)">
      <circle cx="6" cy="0" r="6" fill="var(--accent)"/>
      <text x="18" y="4.5">monitored well</text>
      <path d="M128,0 L150,0" stroke="var(--accent)" stroke-width="2"/><path d="M150,0 L170,0" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="178" y="4.5">measured, then forecast in time</text>
      <circle cx="398" cy="0" r="7" fill="var(--surface)" stroke="var(--accent-2)" stroke-width="2"/>
      <text x="412" y="4.5">predicted in space</text>
    </g>
  </g>
</svg>
