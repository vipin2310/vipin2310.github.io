about:
- >-
  I am a PhD candidate in Data Science at the Berliner Hochschule für Technik (BHT), supervised by Prof. Dr. Felix
  Bießmann in the [Cognitive Algorithms Lab](https://calgo-lab.de/).
- >-
  I build machine learning for environmental monitoring and evaluate it holistically: not only accuracy, but also
  model complexity and robustness when data are incomplete, noisy or sparse. With partners such as the Federal Institute
  for Geosciences and Natural Resources (BGR), I apply this to urban sewer systems, soil science and groundwater.
interests:
- Holistic model evaluation
- Robustness
- Time series forecasting
- Spatiotemporal modeling
- Multimodal deep learning
- Uncertainty quantification
- Expert-AI collaboration
profile: >-
  Data science researcher with a background in mathematics and four years of industrial software
  development. I develop and evaluate machine learning models for environmental applications, from time series
  forecasting in urban sewer systems to multimodal soil horizon classification and spatiotemporal groundwater
  level prediction, with a focus on holistic evaluation protocols that assess predictive performance, model
  complexity and robustness together. Experienced in coordinating work packages in joint research projects
  with public agencies and industry.
profile_short: >-
  Data science researcher with a background in mathematics and industrial software development. Experienced in
  building holistic evaluation protocols for machine learning models and managing research projects.

projects:
- id: groundwater
  title: Groundwater level prediction at unmonitored locations
  partner: with BGR
  years: 2025–present
  text: >-
    Can a dense monitoring network predict groundwater levels at future times and at locations without a well, and
    what limits it? With BGR, we benchmark temporal, spatial and coupled models for Brandenburg under one evaluation
    protocol. Manuscript in preparation.
  tags: [Spatiotemporal modeling, Gaussian Processes, Uncertainty]
  links: []
  figure: project-groundwater.svg
  caption: >-
    Forecast groundwater levels in time at monitored wells, and predict them in space where no well exists.
- id: soil
  title: SoilNet, AI-assisted soil horizon description
  partner: with BGR
  years: 2025–present
  text: >-
    Describing soil horizons from profile images is slow and varies between experts. SoilNet mirrors the experts'
    annotation workflow, and in a user study, experts working with the SoilNet App annotated more accurately and
    more consistently.
  tags: [Multimodal deep learning, Computer vision, Expert-AI collaboration]
  links:
  - {label: Live demo, url: "https://soilnet.demo.calgo-lab.de/"}
  - {label: Code, url: "https://github.com/calgo-lab/BGR"}
  - {label: BGR, url: "https://www.bgr.bund.de/"}
  figure: project-soil.webp
  caption: A soil profile image with horizon symbols, depth markers and horizon-specific tabular information 
    (Singh et al., Geoderma 2026, Fig. 1).
- id: sewer
  title: RIWWER, resilient forecasting for urban sewer systems
  partner: with University of Duisburg-Essen and partners
  years: 2023–2026
  text: >-
    Combined sewer systems overflow during heavy rain. In the joint project RIWWER, I coordinated the AI work package:
    forecasting models for rain basins that stay robust to sensor failures and run both in the cloud and on embedded
    FPGAs at the edge.
  tags: [Time series forecasting, Robustness, Edge AI]
  links:
  - {label: Live demo, url: "https://riwwer.demo.calgo-lab.de/"}
  - {label: Code, url: "https://github.com/calgo-lab/resilient-timeseries-evaluation"}
  - {label: Project, url: "https://www.riwwer.fraunhofer.de/"}

