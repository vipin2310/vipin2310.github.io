news:
- date: 2026-10-15
  title: SoilNet workshop on AI in soil science, 9 December in Berlin
  image: 2026-10-ki-bodenkunde-1.jpg
  fit: contain
  url: https://www.linkedin.com/feed/update/urn:li:share:7516456706915196928/
  slug: 2026-10-soil-workshop
  author: Bundesanstalt für Geowissenschaften und Rohstoffe (BGR)
  images:
  - 2026-10-ki-bodenkunde-1.jpg
  body: |
    📆 KI in der Bodenkunde - SoilNet Workshop am 9. Dezember 2026 in Berlin

    Die Bundesanstalt für Geowissenschaften und Rohstoffe (BGR) und die Berliner Hochschule für Technik (BHT) stellen bei der Veranstaltung im Einstein Center Digital Future (Beginn: 9 Uhr) eine KI-basierte Lösung zur automatisierten Segmentierung und Klassifizierung von Bodenhorizonten vor.

    Eine interaktive Kurzstudie bietet Interessierten die Gelegenheit zum thematischen Austausch. Zudem gibt es eine Poster-Session zu digitalen Methoden im Bodenschutz.

    👉 Hier gehts zur Anmeldung: https://calgo-lab.de/soil-workshop/en/
    Unter dem Link finden Sie auch weitere Infos zum Programm.

    #KI #Boden #Bodenhorizonte #Bodenschutz
- date: 2026-10-09
  title: Presented the SoilNet App at KIDA-KON 2026 in Berlin
  image: 2026-10-kida-kon-1.jpg
  url: https://www.linkedin.com/feed/update/urn:li:ugcPost:7514290789934616576/
  slug: 2026-10-kida-kon
  author: Vipin Singh
  author_url: https://www.linkedin.com/in/vipin-singh-131402271
  images:
  - 2026-10-kida-kon-1.jpg
  - 2026-10-kida-kon-2.jpg
  - 2026-10-kida-kon-3.jpg
  body: |
    I was happy to return to KIDA KON 2026 last week! Last year we introduced our model SoilNet, which automatically describes and classifies soil horizons, the core units of soil science and agriculture. This time we showcased the SoilNet App, which allows field annotators and other interested users to interact with SoilNet and experience how AI assistance can support them in this task.

    Alongside the app, we presented the results of the user study we conducted with it. The study shows that experts often disagree within this complex taxonomy (over 1,200 labels!). AI assistance made their annotations more consistent while also improving their performance.

    If you’d like to learn more about this work, you can find our paper published at IJCAI International Joint Conferences on Artificial Intelligence Organization 2026 here: https://doi.org/10.24963/ijcai.2026/993

    We would also like to invite you to our workshop on AI in soil science on 9 December in Berlin. Find out more here: https://calgo-lab.de/soil-workshop/en/

    Thank you to everyone who contributed to this work: Teodor Chiaburu, Joey Prüssing, Sina Hesse, Einar Eberhardt, Stefan Broda, Frank Haußer, Felix Biessmann

    Project at: Berlin University of Applied Sciences Berlin (BHT), Federal Institute for Geosciences and Natural Resources (BGR)

    Co-funded by: Deutsche Forschungsgemeinschaft (DFG) - German Research Foundation

    KIDA located at: Bundesinstitut für Risikobewertung in Berlin
- date: 2026-08-26
  title: Presented two demos at IJCAI-ECAI 2026 in Bremen
  image: 2026-08-ijcai-3.jpg
  url: https://www.linkedin.com/feed/update/urn:li:ugcPost:7498347025810321408/
  slug: 2026-08-ijcai
  author: Vipin Singh
  author_url: https://www.linkedin.com/in/vipin-singh-131402271
  images:
  - 2026-08-ijcai-3.jpg
  - 2026-08-ijcai-1.jpg
  - 2026-08-ijcai-2.jpg
  - 2026-08-ijcai-4.jpg
  body: |
    Last week I attended IJCAI-ECAI 2026 in Bremen and had the chance to present two demo papers! 🎉 Seeing two projects that I have worked on come to life at such a big conference was very rewarding:

    🌧️ “A Resilient Solution for Sewer Overflow Monitoring across Cloud and Edge” demonstrates how AI-based forecasts can support sewer overflow monitoring—even when the connection to the cloud is interrupted. Read it here: https://doi.org/10.24963/ijcai.2026/994

    🌱 “SoilNet App: AI-Assisted Expert-level Annotations of Soil Horizons” explores how AI can assist soil experts with a highly complex annotation task. Our study suggests that this collaboration can improve both expert performance and consistency. Read it here: https://doi.org/10.24963/ijcai.2026/993

    Beyond presenting the demos, what I valued most about IJCAI was meeting the research community. I especially enjoyed the conversations at the demo booths, where I met many interesting people, received thoughtful questions and new perspectives, and discussed our work with researchers from different areas of AI.

    Bremen provided a nice setting for the conference, and the banquet at the Weserstadion was another highlight. All these experiences made this conference particularly memorable.

    None of this would have been possible without the support of the people behind the projects:

    🌧️ Sewer overflow monitoring: Tianheng Ling, Peter Ghaly, M.Sc., Felix Grimmeisen, Gregor Schiele, and Felix Biessmann.

    🌱 SoilNet App: Joey Prüssing, Teodor Chiaburu, Einar Eberhardt, Sina Hesse, Stefan Broda, Frank Haußer, and Felix Biessmann.

    A special thank you to my supervisor, Felix Biessmann, for supporting me throughout both projects and for joining me in presenting the demos.

    I am leaving with many new impressions and am grateful that I had the opportunity to attend such a great conference.
- date: 2026-02-06
  title: SoilNet published in Geoderma
  image: 2026-02-geoderma-1.jpg
  fit: contain
  url: https://www.linkedin.com/feed/update/urn:li:share:7425513348609363968/
  slug: 2026-02-geoderma
  author: Vipin Singh
  author_url: https://www.linkedin.com/in/vipin-singh-131402271
  images:
  - 2026-02-geoderma-1.jpg
  body: |
    Our latest research got published in Geoderma (Elsevier): "SoilNet: A multimodal multitask model for hierarchical classification of soil horizons". 

    I am proud to see our work on SoilNet featured by our partners from the Federal Institute for Geosciences and Natural Resources (BGR). While general-purpose LLM's are impactful and impressive, our research in Geoderma demonstrates that for specialized fields like pedology they still hit a wall when faced with the structural logic and complexity.

    Food security: Accurate soil data is the foundation of global food security, and by automating the classification process, SoilNet contributes towards scalable high-resolution mapping for sustainable land management. We are happy to share more details in the attached post.

    Thanks: This work was a collaborative effort between geoscientists and ML researchers. A sincere thank you to my co-authors: Teodor Chiaburu, Einar Eberhardt, Stefan Broda, Joey Prüssing, Frank Haußer, and Felix Biessmann.

    Read the full study here: https://doi.org/10.1016/j.geoderma.2026.117684
