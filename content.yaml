  body: |
    🌧️ KI gegen Starkregen: Projekt RIWWER erfolgreich abgeschlossen

    Starkregenereignisse nehmen im Zuge des Klimawandels zu. Unsere städtischen Abwassernetze geraten dabei schnell an ihre Grenzen. Das Forschungsprojekt RIWWER an unserem RWTH Institute for Technology and Innovation Management (TIM) hat in einem großen Konsortium aus Wissenschaft und Wirtschaft in den letzten drei Jahren daran gearbeitet, Kommunen mit intelligenter Sensorik und KI-Algorithmen besser auf Extremwetter vorzubereiten 💡🌧️ 

    👉 Die wichtigsten Ergebnisse:

    🔹 KI-basierte Vorhersage: Ein Dashboard kombiniert Online-Wetterdaten mit Sensordaten aus dem Netz und prognostiziert Füllstände und Mischwasserüberläufe. Die datengetriebene KI ist auf andere Netze übertragbar (Demo zum selber testen).
    🔹 KI-basierte Steuerung: Ein Teststand ermöglicht das Training automatisierter Steuerungen und hilft bei der Überwindung von Modellunsicherheiten.
    🔹 VDI-Expertenempfehlung 4900: Ein Leitfaden für Betreiber, wie Digitalisierungsvorhaben in Abwassernetzen erfolgreich umgesetzt werden können (Veröffentlichung im Frühjahr 2026).

    Luis Alexander Kaufhold und Frank Piller aus unserer Fakultät haben RIWWER wirtschaftlich begleitet. Der Fokus lag dabei auf dem Thema Geschäftsmodellentwicklung:

    🔸 Wer profitiert von KI-Steuerungen? Vor allem Betreiber in Mittel- und Großstädten mit Mischsystem, ausreichendem Speichervolumen und vermaschten Netzen.
    🔸 Wie lassen sich Daten weiter nutzen? Betreiber können Füllstands- und Durchflussdaten teilen – z.B. mit Kläranlagen (Planung von Reinigung & Energieversorgung) oder mit Frühwarnsystemen (Überflutungswarnungen für Bürger*innen).

    🤝 Das Konsortium – ein starkes Team aus Forschung, Wirtschaft und Verbänden:

    Fraunhofer IMS · Universität Duisburg-Essen · Berliner Hochschule für Technik (BHT) · KROHNE · Okeanos Smart Data Solutions GmbH · HST Systemtechnik GmbH & Co.KG · VDI e.V. · RWTH Aachen University

    Gefördert wurde RIWWER vom Bundesministerium für Wirtschaft und Energie (BMWE) im Rahmen des Technologieprogramms EDGE Datenwirtschaft.
